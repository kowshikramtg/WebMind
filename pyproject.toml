[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "webmind"
dynamic = ["version"]
description = "Open-source, self-hosted, LLM-agnostic website intelligence infrastructure (permission-aware RAG, analytics and navigation)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "WebMind contributors" }]
keywords = ["rag", "retrieval", "llm", "assistant", "self-hosted", "search", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core stays lightweight: everything here is pure-Python or ships wheels for
# all major platforms. Heavier integrations live in optional extras below.
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "zstandard>=0.22",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
xlsx = ["openpyxl>=3.1"]
reports = ["reportlab>=4.0"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
rsa = ["cryptography>=42"]
numpy = ["numpy>=1.26"]
rerank = ["sentence-transformers>=2.6"]
local-embeddings = ["sentence-transformers>=2.6"]
langgraph = ["langgraph>=0.2"]
all = [
  "webmind[pdf,docx,xlsx,reports,postgres,mysql,rsa,numpy]",
]
dev = [
  "webmind[pdf,xlsx,reports,numpy]",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
webmind = "webmind.cli.main:main"

[project.urls]
Homepage = "https://github.com/kowshikramtg/WebMind"
Documentation = "https://github.com/kowshikramtg/WebMind/tree/main/docs"
Issues = "https://github.com/kowshikramtg/WebMind/issues"

[tool.hatch.version]
path = "src/webmind/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/webmind"]

[tool.hatch.build.targets.sdist]
include = ["src/webmind", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: requires WEBMIND_TEST_POSTGRES_URL pointing at PostgreSQL with pgvector",
  "security: security boundary tests (release-blocking)",
]
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S101",  # assert is fine in tests
  "B008",  # FastAPI Depends() in defaults
  "SIM102", # nested ifs are often clearer
  "SIM905", # str.split word lists are readable
  "S608",  # SQL is built with SQLAlchemy Core / bound params; flagged false-positives on text()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"examples/**" = ["S105", "S106", "S311", "S104"]
