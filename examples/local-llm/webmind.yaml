# Fully local setup: Ollama for generation AND embeddings, nothing leaves your machine.
#
#   ollama pull llama3.1
#   ollama pull nomic-embed-text
#   webmind index --config examples/local-llm/webmind.yaml
#   webmind serve --config examples/local-llm/webmind.yaml
app:
  name: local-llm-demo
  environment: development

database:
  url: sqlite:///./data/webmind.db

object_store:
  path: ./data/objects

llm:
  provider: ollama
  model: ${OLLAMA_MODEL:-llama3.1}
  base_url: ${OLLAMA_URL:-http://localhost:11434}
  temperature: 0.1
  max_tokens: 1024

embeddings:
  provider: ollama
  model: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  base_url: ${OLLAMA_URL:-http://localhost:11434}

retrieval:
  hybrid_search: true
  min_semantic_score: 0.3     # neural embeddings have a higher similarity floor than the hashing baseline

security:
  authentication:
    mode: public

sources:
  - id: demo-site
    type: filesystem
    path: ../basic-website/site
    patterns: ["**/*.html"]
    base_url: http://localhost:8000
    path_rules:
      - pattern: "^internal/"
        access: { visibility: restricted, roles: [admin] }
