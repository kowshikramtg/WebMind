[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "webmind-client"
version = "0.1.0"
description = "Lightweight HTTP client and token helper for a self-hosted WebMind server."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "WebMind contributors" }]
dependencies = ["httpx>=0.27", "pyjwt>=2.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/webmind_client"]
